
<style>
#erd-wrap svg { width: 100% !important; }
</style>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Entity Relationship Diagram for Role-Based Access Control System</h2>
<div id="erd-wrap" style="padding:1rem 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a38' : '#eeedfe',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    primaryTextColor: dark ? '#c2c0b6' : '#26215C',
    secondaryColor: dark ? '#1a2e2a' : '#e1f5ee',
    secondaryBorderColor: dark ? '#0F6E56' : '#0F6E56',
    secondaryTextColor: dark ? '#9FE1CB' : '#04342C',
    tertiaryColor: dark ? '#2a1f14' : '#faeeda',
    tertiaryBorderColor: dark ? '#854F0B' : '#854F0B',
    tertiaryTextColor: dark ? '#FAC775' : '#412402',
    noteBkgColor: dark ? '#1f1f1f' : '#f5f5f5',
    noteTextColor: dark ? '#c2c0b6' : '#3d3d3a',
    edgeLabelBackground: dark ? '#1a1a1a' : '#ffffff',
  },
});
const diagram = `erDiagram
  roles {
    int id PK
    string role_name
    string description
    datetime created_at
    datetime updated_at
  }
  users {
    int id PK
    int role_id FK
    string name
    string email
    string password
    string phone
    text address
    enum status
    datetime created_at
    datetime updated_at
  }
  menus {
    int id PK
    int parent_id FK
    string menu_name
    string menu_slug
    string menu_url
    string icon
    int sort_order
    boolean is_active
    datetime created_at
    datetime updated_at
  }
  actions {
    int id PK
    string action_name
    string description
    datetime created_at
  }
  role_permissions {
    int id PK
    int role_id FK
    int menu_id FK
    int action_id FK
    datetime created_at
  }
  audit_logs {
    int id PK
    int user_id FK
    string module
    string activity
    string ip_address
    string user_agent
    datetime created_at
  }

  roles ||--o{ users : "has"
  roles ||--o{ role_permissions : "grants"
  menus ||--o{ role_permissions : "covered by"
  actions ||--o{ role_permissions : "defines"
  menus ||--o{ menus : "parent of"
  users ||--o{ audit_logs : "generates"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd-wrap').innerHTML = svg;

document.querySelectorAll('#erd-wrap svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd-wrap svg .row-rect-odd path, #erd-wrap svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
